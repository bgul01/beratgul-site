<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="dark">
  <meta name="theme-color" content="#0b1018">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Aradığınız sayfa bulunamadı.">
  <meta name="robots" content="noindex, follow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'sha256-Gufz2PPXAi+rx2dhAxfML07mqSTzW5Gd+KajYMRH3Nc='; img-src 'self' data:; font-src 'none'; script-src 'none'; connect-src 'none'; form-action 'none'; object-src 'none'; base-uri 'none'; frame-src 'none'; upgrade-insecure-requests">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230b1018'/%3E%3Ctext x='32' y='42' font-size='28' font-family='sans-serif' font-weight='700' text-anchor='middle' fill='%236fd0ff'%3EBG%3C/text%3E%3C/svg%3E">
  <title>404 — Sayfa bulunamadı · Berat Gül</title>
  <style>
    :root{color-scheme:dark;--bg:#0b1018;--ink:#eef2f8;--muted:#9aa6ba;--line:rgba(255,255,255,.1);--line-strong:rgba(255,255,255,.22);--accent:#6fd0ff;--ok:#7ee0b0;--serif:ui-serif,"Iowan Old Style","Palatino Linotype",Georgia,serif;--sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
    *{box-sizing:border-box}
    html{min-height:100%}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse 50% 55% at 78% 48%,rgba(111,208,255,.10),transparent 70%),var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
    a{color:inherit}
    a:focus-visible{outline:2px solid var(--accent);outline-offset:5px;border-radius:6px}
    .wrap{max-width:1120px;min-height:100vh;margin:0 auto;padding:max(32px,env(safe-area-inset-top)) 40px max(28px,env(safe-area-inset-bottom));display:flex;flex-direction:column}
    .top{display:flex;justify-content:space-between;align-items:center;gap:20px}
    .brand{display:flex;align-items:center;gap:12px;text-decoration:none;font-size:17px;font-weight:650;letter-spacing:-.02em}
    .mark{width:40px;height:40px;border:1px solid var(--line-strong);border-radius:12px;display:grid;place-items:center;font-size:14px;font-weight:700;letter-spacing:-.04em;color:var(--accent)}
    .dim{color:#6f7d95}
    .status{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);padding:8px 14px;border:1px solid var(--line);border-radius:999px}
    .light{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 0 4px rgba(126,224,176,.14);animation:pulse 2.4s ease-in-out infinite}
    .main{flex:1;display:grid;grid-template-columns:minmax(0,1.15fr) minmax(240px,.85fr);align-items:center;gap:56px;padding:72px 0 80px}
    h1{margin:0 0 24px;font-family:var(--serif);font-weight:500;font-size:clamp(48px,7.4vw,96px);line-height:1.02;letter-spacing:-.035em;text-wrap:balance}
    .lead{max-width:46ch;margin:0 0 32px;color:var(--muted);font-size:clamp(17px,1.7vw,19px);line-height:1.7}
    .tags{display:flex;flex-wrap:wrap;gap:10px;margin:0;padding:0;list-style:none}
    .tags li{padding:9px 14px;border:1px solid var(--line);border-radius:10px;color:#c3ccdb;font-size:14px}
    .stage{justify-self:center;width:100%;max-width:270px}
    .phone{aspect-ratio:9/18;border:1.5px solid var(--line-strong);border-radius:40px;padding:12px;background:linear-gradient(160deg,rgba(255,255,255,.05),rgba(255,255,255,.01));box-shadow:0 30px 80px rgba(0,0,0,.45)}
    .screen{height:100%;border-radius:30px;background:#0e1522;border:1px solid var(--line);padding:22px 18px 20px;display:flex;flex-direction:column;gap:14px;overflow:hidden}
    .notch{align-self:center;width:64px;height:6px;border-radius:99px;background:var(--line-strong);margin-bottom:6px}
    .bar{height:10px;border-radius:6px;background:rgba(255,255,255,.08)}
    .bar.w1{width:46%}.bar.w2{width:82%}.bar.w3{width:64%}
    .card{flex:1;min-height:0;border-radius:18px;background:linear-gradient(145deg,rgba(111,208,255,.22),rgba(111,208,255,.04));border:1px solid rgba(111,208,255,.25);position:relative}
    .card:after{content:"404";position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);font-size:44px;letter-spacing:-.04em;color:rgba(238,242,248,.85)}
    .track{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
    .fill{display:block;height:100%;width:72%;border-radius:inherit;background:var(--accent);animation:build 2.6s cubic-bezier(.2,.7,.2,1) both}
    .caption{margin:0;font-size:12px;color:var(--muted)}
    .actions{display:flex;flex-wrap:wrap;gap:12px}.btn{display:inline-flex;align-items:center;padding:13px 22px;border-radius:12px;background:var(--accent);color:#06121c;font-weight:650;font-size:15px;text-decoration:none}.btn:hover{filter:brightness(1.1)}.btn:focus-visible{outline:2px solid var(--ink);outline-offset:4px}.footer{border-top:1px solid var(--line);padding-top:20px;display:flex;justify-content:space-between;gap:16px;color:#7d8aa1;font-size:13px}
    .footer strong{color:#c3ccdb;font-weight:550}
    @keyframes build{from{width:0}to{width:72%}}
    @keyframes pulse{50%{box-shadow:0 0 0 7px rgba(126,224,176,0)}}
    @media(max-width:760px){.wrap{padding-left:22px;padding-right:22px}.main{grid-template-columns:1fr;gap:44px;padding:56px 0 56px}.stage{max-width:220px;justify-self:start}.status{font-size:12px;padding:7px 12px}.footer{flex-direction:column;gap:6px}}
    @media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div class="wrap">
    <header class="top">
      <a class="brand" href="/" aria-label="Berat Gül ana sayfa"><span class="mark" aria-hidden="true">BG</span><span>Berat Gül<span class="dim">.</span></span></a>
      <div class="status"><span class="light" aria-hidden="true"></span>Hata 404</div>
    </header>
    <main class="main">
      <section aria-labelledby="headline">
        <h1 id="headline">Bu sayfa bulunamadı.</h1>
        <p class="lead">Aradığınız adres taşınmış, silinmiş ya da hiç var olmamış olabilir. Adresi kontrol edebilir veya ana sayfaya dönebilirsiniz.</p>
        <div class="actions"><a class="btn" href="/">Ana sayfaya dön</a></div>
      </section>
      <div class="stage" aria-hidden="true">
        <div class="phone"><div class="screen">
          <span class="notch"></span>
          <span class="bar w1"></span>
          <span class="bar w2"></span>
          <div class="card"></div>
          <span class="bar w3"></span>
          <p class="caption">Sayfa bulunamadı</p>
        </div></div>
      </div>
    </main>
    <footer class="footer"><span>© 2026 <strong>Berat Gül</strong>. Tüm hakları saklıdır.</span><span>beratgul.com</span></footer>
  </div>
</body>
</html>
